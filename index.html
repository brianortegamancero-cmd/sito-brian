<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainOS</title>
  <!-- Font: mi collego in anticipo ai server di Google, così i caratteri arrivano prima -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://docs.google.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="colonia.css">
  <!-- Icona nella scheda del browser: la formica del logo -->
  <link rel="icon" href="img/icona.svg" type="image/svg+xml">
</head>
<body>

  <!-- 1. AVVIO: lo schermo nero con le righe del BIOS e la barra di caricamento -->
  <section id="avvio" class="schermo avvio" hidden>
    <img src="img/logo.svg" alt="Bryant Developer" class="avvio-logo">
    <div id="avvio-righe" class="avvio-righe"></div>
    <div class="avvio-barra"><div id="avvio-riempimento"></div></div>
    <p class="avvio-salta">premi un tasto per saltare</p>
  </section>

  <!-- 2. SCHERMATA DI BLOCCO: orologio grande, si sblocca con un clic o un tasto -->
  <section id="blocco" class="schermo blocco" hidden>
    <div class="blocco-orologio">
      <p id="blocco-ora" class="blocco-ora">--:--</p>
      <p id="blocco-data" class="blocco-data"></p>
    </div>
    <p class="blocco-invito">clicca o premi un tasto per accedere</p>
    <footer class="piede" data-piede></footer>
  </section>

  <!-- 3. LOGIN: utente Brian con la sua password -->
  <section id="login" class="schermo login" hidden>
    <form id="login-modulo" class="login-scheda" autocomplete="off">
      <img id="login-foto" class="login-foto" src="img/foto.jpg" alt="Brian Ortega">
      <h1 class="login-nome">Brian Ortega</h1>
      <p class="login-ruolo">Amministratore · Bryant Developer</p>

      <div class="login-campo">
        <input id="login-password" type="password" placeholder="Password" aria-label="Password" autocomplete="off" spellcheck="false">
        <button type="button" id="login-occhio" class="login-occhio" aria-label="Mostra la password" title="Mostra la password">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
        <button type="submit" class="login-invio" aria-label="Accedi">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14 M13 6l6 6-6 6"></path></svg>
        </button>
      </div>

      <p id="login-errore" class="login-errore" role="alert"></p>
      <p id="login-suggerimento" class="login-suggerimento">Inserisci la password per accedere.</p>
    </form>

    <footer class="piede" data-piede></footer>

    <div class="login-fondo">
      <span>BrainOS v2.0</span>
      <button type="button" id="login-spegni" class="login-spegni" aria-label="Arresta il sistema" title="Arresta il sistema">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9 M6.3 6.5a8 8 0 1 0 11.4 0"></path></svg>
      </button>
    </div>
  </section>

  <!-- 3b. BENVENUTO: compare un attimo dopo il login -->
  <section id="benvenuto" class="schermo benvenuto" hidden>
    <div class="benvenuto-giro"></div>
    <p>Benvenuto, Brian</p>
  </section>

  <!-- 4. IL SISTEMA: desktop, finestre, barra delle applicazioni -->
  <div id="sistema" class="sistema" hidden>
    <div id="sfondo" class="sfondo" data-sfondo="formicaio">
      <img src="img/icona.svg" alt="" class="sfondo-formica">
    </div>

    <!-- il footer sul desktop: piccolo, in basso a destra sopra la barra -->
    <footer class="piede piede-desktop" data-piede></footer>

    <!-- icone: le crea os.js -->
    <div id="icone" class="icone-desktop"></div>

    <!-- le finestre aperte: le crea os.js -->
    <div id="finestre" class="finestre"></div>

    <!-- le notifiche: le crea funzioni.js -->
    <div id="notifiche" class="notifiche" aria-live="polite"></div>

    <!-- menu start -->
    <div id="menu-start" class="menu-start" hidden>
      <div class="menu-start-utente">
        <img src="img/foto.jpg" alt="" class="menu-start-foto">
        <div>
          <p class="menu-start-nome">Brian Ortega</p>
          <p class="menu-start-sotto">BrainOS v2.0</p>
        </div>
      </div>
      <div id="menu-start-app" class="menu-start-app"></div>
      <div class="menu-start-fondo">
        <button type="button" data-potenza="disconnetti">Disconnetti</button>
        <button type="button" data-potenza="riavvia">Riavvia</button>
        <button type="button" data-potenza="arresta" class="menu-start-arresta">Arresta il sistema</button>
      </div>
    </div>

    <!-- menu del tasto destro -->
    <div id="menu-contestuale" class="menu-contestuale" hidden></div>

    <!-- barra delle applicazioni -->
    <div class="barra-applicazioni">
      <div class="barra-sinistra">
        <button id="start" class="start" aria-expanded="false" aria-controls="menu-start">
          <img src="img/icona.svg" alt="">
          start
        </button>
        <div id="barra-app" class="barra-app"></div>
      </div>

      <div class="barra-destra">
        <button id="tasto-suoni" class="tasto-suoni" type="button" aria-label="Disattiva i suoni" title="Suoni attivi">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path class="onde" d="M16 9a4 4 0 0 1 0 6 M18.5 6.5a8 8 0 0 1 0 11"></path><path class="croce" d="M16 9l5 6 M21 9l-5 6"></path></svg>
        </button>
        <svg id="wifi" viewBox="0 0 24 24" role="img" aria-label="Connesso a Internet"><path d="M2.5 9a14 14 0 0 1 19 0 M5.5 12.5a9.5 9.5 0 0 1 13 0 M8.8 15.8a5 5 0 0 1 6.4 0 M12 19.5h.01"></path></svg>
        <span class="batteria-desktop">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 7.5h17v9h-17z M21.5 10.5v3"></path><rect id="batteria-carica" x="4.5" y="9.5" width="13" height="5"></rect></svg>
          <span id="batteria-testo"></span>
        </span>
        <div class="orologio">
          <span id="ora">--:--</span>
          <span id="data"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- 5. SPEGNIMENTO / RIAVVIO -->
  <section id="spento" class="schermo spento-schermo" hidden>
    <p id="spento-testo"></p>
  </section>

  <!-- IL FOOTER (uguale a quello del vecchio sito): os.js lo copia in blocco, login e desktop -->
  <template id="modello-piede">
    <div class="piede-chi">
      <img src="img/icona.svg" alt="" class="piede-formica">
      <div>
        <p class="piede-nome">Brian Ortega</p>
        <p>Operatore informatico · Milano</p>
      </div>
    </div>

    <a class="piede-github" href="https://github.com/brianortegamancero-cmd" target="_blank" rel="noopener noreferrer">
      <img src="img/github.svg" alt="" width="20" height="20">
      <span>github.com/brianortegamancero-cmd</span>
    </a>

    <div class="piede-scuola">
      <p>Progetto d'esame realizzato al</p>
      <img src="img/logo-scuola.webp" alt="CFP Immaginazione e Lavoro" class="logo-scuola">
    </div>

    <p class="piede-fondo">© 2026 Brian Ortega · Realizzato in HTML, CSS e JavaScript · BrainOS v2.0</p>
  </template>

  <!-- MODELLO DELLA FINESTRA COLONIA: os.js lo copia quando apri l'app "Colonia" -->
  <template id="modello-colonia">
    <div class="colonia-app">
      <div class="colonia-vista" id="colonia-vista">
    <div class="mondo">
      <svg class="formicaio" viewBox="0 0 960 552" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- sassolini nella terra -->
        <g fill="#12301a">
          <circle cx="120" cy="140" r="1.6"></circle><circle cx="260" cy="180" r="1.4"></circle><circle cx="350" cy="120" r="1.8"></circle><circle cx="600" cy="260" r="1.5"></circle><circle cx="720" cy="230" r="1.6"></circle><circle cx="880" cy="200" r="1.4"></circle><circle cx="150" cy="420" r="1.8"></circle><circle cx="420" cy="500" r="1.5"></circle><circle cx="560" cy="420" r="1.6"></circle><circle cx="700" cy="480" r="1.4"></circle><circle cx="900" cy="520" r="1.7"></circle><circle cx="80" cy="520" r="1.5"></circle><circle cx="620" cy="520" r="1.6"></circle><circle cx="780" cy="300" r="1.5"></circle><circle cx="360" cy="250" r="1.4"></circle><circle cx="470" cy="420" r="1.7"></circle>
        </g>
        <!-- ciuffi d'erba e linea del terreno con la collinetta del formicaio -->
        <path class="erba" d="M60 90 l-3 -10 M64 90 l1 -14 M68 90 l4 -9 M180 90 l-2 -9 M184 90 l2 -12 M300 90 l-3 -11 M304 90 l1 -8 M640 90 l-2 -12 M644 90 l3 -9 M760 90 l-3 -9 M764 90 l1 -13 M768 90 l3 -8 M900 90 l-2 -11 M904 90 l2 -9" stroke="#1c5a2a" stroke-width="1.5"></path>
        <path class="terreno" d="M-1000 90 H400 Q480 34 560 90 H2000" stroke="#1c2b1f" stroke-width="2"></path>

        <!-- I SENTIERI IN SUPERFICIE (invisibili): le formiche li usano per uscire a cercare cibo -->
        <path id="t-fuori-erba" d="M1150 84 H760"></path>
        <path id="t-erba-buco" d="M760 84 H556 Q520 50 480 62"></path>
        <path id="t-fuori-cimitero" d="M-260 84 H180"></path>
        <path id="t-cimitero-buco" d="M180 84 H404 Q440 50 480 62"></path>

        <!-- IL CIMITERO: il mucchietto lo disegna script.js, un segno per ogni formica morta -->
        <g id="cimitero-disegno" fill="#8a9a8c"></g>
        <text x="150" y="108" fill="#8a9a8c" font-family="JetBrains Mono, monospace" font-size="11">\cimitero</text>

        <!-- LA NEVE: si vede solo d'inverno (classe "inverno" su .mondo) -->
        <g class="neve">
          <circle class="fiocco" style="animation-delay: 0s" cx="40" cy="10" r="1.6"></circle>
          <circle class="fiocco" style="animation-delay: -1s" cx="120" cy="4" r="1.3"></circle>
          <circle class="fiocco" style="animation-delay: -2.2s" cx="200" cy="12" r="1.8"></circle>
          <circle class="fiocco" style="animation-delay: -0.5s" cx="280" cy="6" r="1.4"></circle>
          <circle class="fiocco" style="animation-delay: -3s" cx="360" cy="10" r="1.6"></circle>
          <circle class="fiocco" style="animation-delay: -1.6s" cx="440" cy="2" r="1.3"></circle>
          <circle class="fiocco" style="animation-delay: -2.7s" cx="530" cy="8" r="1.8"></circle>
          <circle class="fiocco" style="animation-delay: -0.8s" cx="610" cy="12" r="1.4"></circle>
          <circle class="fiocco" style="animation-delay: -3.4s" cx="690" cy="4" r="1.6"></circle>
          <circle class="fiocco" style="animation-delay: -1.3s" cx="770" cy="10" r="1.3"></circle>
          <circle class="fiocco" style="animation-delay: -2.4s" cx="850" cy="6" r="1.8"></circle>
          <circle class="fiocco" style="animation-delay: -0.2s" cx="930" cy="12" r="1.4"></circle>
        </g>

        <!-- TUNNEL E CAMERE: data-camera dice da quante camere scavate in su si vede quel pezzo
             (1 = regina, 2 = uova, 3 = cibo, 4 = scorte, 5 = caserma).
             Prima disegno tutti i bordi, poi tutti gli interni scuri: così i bordi non coprono gli incroci -->
        <g stroke="#1c2b1f" stroke-width="20">
          <path data-camera="1" d="M480 62 C474 95 480 125 492 150"></path>
          <path data-camera="1" d="M492 150 C504 175 518 200 510 230"></path>
          <path data-camera="1" d="M510 230 C590 250 650 290 700 320"></path>
          <path data-camera="1" d="M700 320 C740 345 770 370 800 398"></path>
          <path data-camera="2" d="M510 230 C490 290 430 310 400 350"></path>
          <path data-camera="2" d="M400 350 C370 390 340 420 310 455"></path>
          <path data-camera="3" d="M400 350 C360 335 310 325 275 303"></path>
          <path data-camera="4" d="M492 150 C540 160 590 170 630 178"></path>
          <path data-camera="5" d="M700 320 C690 380 665 420 645 465"></path>
        </g>
        <g fill="#1c2b1f">
          <ellipse data-camera="1" cx="830" cy="410" rx="72" ry="30"></ellipse>
          <ellipse data-camera="2" cx="300" cy="460" rx="60" ry="24"></ellipse>
          <ellipse data-camera="3" cx="262" cy="300" rx="52" ry="22"></ellipse>
          <ellipse data-camera="4" cx="650" cy="180" rx="44" ry="19"></ellipse>
          <ellipse data-camera="5" cx="640" cy="480" rx="54" ry="22"></ellipse>
        </g>
        <!-- gli interni dei tunnel hanno un id: sono i percorsi che seguono le formiche (TRATTI in script.js) -->
        <g stroke="#07150b" stroke-width="16">
          <path id="t-buco-j1" data-camera="1" d="M480 62 C474 95 480 125 492 150"></path>
          <path id="t-j1-j2" data-camera="1" d="M492 150 C504 175 518 200 510 230"></path>
          <path id="t-j2-j4" data-camera="1" d="M510 230 C590 250 650 290 700 320"></path>
          <path id="t-j4-regina" data-camera="1" d="M700 320 C740 345 770 370 800 398"></path>
          <path id="t-j2-j3" data-camera="2" d="M510 230 C490 290 430 310 400 350"></path>
          <path id="t-j3-uova" data-camera="2" d="M400 350 C370 390 340 420 310 455"></path>
          <path id="t-j3-cibo" data-camera="3" d="M400 350 C360 335 310 325 275 303"></path>
          <path id="t-j1-scorte" data-camera="4" d="M492 150 C540 160 590 170 630 178"></path>
          <path id="t-j4-caserma" data-camera="5" d="M700 320 C690 380 665 420 645 465"></path>
        </g>
        <g fill="#07150b">
          <ellipse data-camera="1" cx="830" cy="410" rx="70" ry="28"></ellipse>
          <ellipse data-camera="2" cx="300" cy="460" rx="58" ry="22"></ellipse>
          <ellipse data-camera="3" cx="262" cy="300" rx="50" ry="20"></ellipse>
          <ellipse data-camera="4" cx="650" cy="180" rx="42" ry="17"></ellipse>
          <ellipse data-camera="5" cx="640" cy="480" rx="52" ry="20"></ellipse>
        </g>
        <!-- il buco d'ingresso in cima alla collinetta -->
        <ellipse cx="480" cy="62" rx="9" ry="4" fill="#000000"></ellipse>

        <!-- camera del cibo: foglie e semi -->
        <g data-camera="3">
          <g fill="#0f8a2c">
            <ellipse cx="240" cy="302" rx="5" ry="2.2" transform="rotate(-25 240 302)"></ellipse>
            <ellipse cx="254" cy="296" rx="5" ry="2.2" transform="rotate(15 254 296)"></ellipse>
            <ellipse cx="268" cy="304" rx="5" ry="2.2" transform="rotate(-10 268 304)"></ellipse>
            <ellipse cx="282" cy="298" rx="5" ry="2.2" transform="rotate(30 282 298)"></ellipse>
          </g>
          <g fill="#e6e6e6"><circle cx="248" cy="307" r="1.8"></circle><circle cx="274" cy="293" r="1.8"></circle><circle cx="262" cy="309" r="1.8"></circle></g>
        </g>
        <!-- camera delle scorte: briciole -->
        <g data-camera="4" fill="#8a9a8c">
          <rect x="632" y="178" width="4" height="4"></rect><rect x="640" y="183" width="3" height="3"></rect><rect x="648" y="176" width="5" height="4"></rect><rect x="658" y="182" width="4" height="3"></rect><rect x="666" y="178" width="3" height="3"></rect>
        </g>
        <!-- i nomi delle camere, scritti come cartelle -->
        <g fill="#8a9a8c" font-family="JetBrains Mono, monospace" font-size="11">
          <text data-camera="1" x="800" y="374">\regina</text>
          <text data-camera="2" x="276" y="430">\uova</text>
          <text data-camera="3" x="232" y="272">\cibo</text>
          <text data-camera="4" x="628" y="156">\scorte</text>
          <text data-camera="5" x="606" y="450">\caserma</text>
        </g>

        <!-- le uova: le disegna script.js, tante quante sono davvero -->
        <g id="uova-disegno" fill="#e6e6e6"></g>

        <!-- la regina: una formica più grande, con la corona -->
        <g id="regina" transform="translate(838 412) scale(2.2) translate(-12 -7)">
          <path d="M11 7 L7.5 2.8 M12.3 7 L12 2 M13.5 7 L16.5 3 M11 7 L9 11.5 M12.3 7 L13.5 12 M13.5 7 L17.5 11 M19 5.6 L22 3 M19 8.4 L22 11" stroke="#00ff41" stroke-width="0.9"></path>
          <ellipse cx="6" cy="7" rx="4.8" ry="3.3" fill="#00ff41"></ellipse>
          <ellipse cx="12.2" cy="7" rx="2.4" ry="1.7" fill="#00ff41"></ellipse>
          <circle cx="17.2" cy="7" r="2.4" fill="#00ff41"></circle>
          <path d="M4.2 4.2 V9.8 M7.2 3.8 V10.2" stroke="#000000" stroke-width="0.6"></path>
          <path d="M15.4 4.4 L15.8 2.6 L16.7 3.6 L17.2 2.2 L17.7 3.6 L18.6 2.6 L19 4.4 Z" fill="#ffffff"></path>
        </g>
        <!-- la nuova regina mentre cresce (seconda vita): un uovo grande con una piccola corona -->
        <g id="regina-nuova" style="display: none">
          <ellipse cx="832" cy="414" rx="8" ry="11" fill="#e6e6e6"></ellipse>
          <path d="M826 401 L827 395 L830 398 L832 393 L834 398 L837 395 L838 401 Z" fill="#00ff41"></path>
        </g>
      </svg>

      <!-- IL VELO DELLA NOTTE: scurisce il formicaio e mostra luna e stelle (classe "notte" su .mondo) -->
      <div class="velo-notte">
        <svg class="cielo-notte" viewBox="0 0 960 90" aria-hidden="true">
          <path d="M904 14 a16 16 0 1 0 14 26 a12 12 0 1 1 -14 -26 z" fill="#e6e6e6"></path>
          <g fill="#e6e6e6"><circle cx="90" cy="20" r="1"></circle><circle cx="230" cy="40" r="1.2"></circle><circle cx="380" cy="14" r="1"></circle><circle cx="620" cy="30" r="1.2"></circle><circle cx="760" cy="12" r="1"></circle><circle cx="840" cy="48" r="1"></circle></g>
        </svg>
      </div>

      <!-- La formica "modello": script.js la copia per fare operaie, soldate, nemiche e alate -->
      <div class="creatura formica" id="modello-formica" hidden>
        <svg viewBox="0 0 24 14" aria-hidden="true">
          <!-- due posizioni delle zampe che si alternano: sembra che cammini -->
          <path class="zampe-a" d="M11 7 L7.5 2.8 M12.3 7 L12 2 M13.5 7 L16.5 3 M11 7 L9 11.5 M12.3 7 L13.5 12 M13.5 7 L17.5 11"></path>
          <path class="zampe-b" d="M11 7 L9 2.5 M12.3 7 L13.5 2 M13.5 7 L17.5 3 M11 7 L7.5 11.2 M12.3 7 L12 12 M13.5 7 L16.5 11"></path>
          <path d="M19 5.6 L22 3 M19 8.4 L22 11"></path>           <!-- antenne -->
          <ellipse cx="6" cy="7" rx="4.8" ry="3.3"></ellipse>       <!-- addome -->
          <ellipse cx="12.2" cy="7" rx="2.4" ry="1.7"></ellipse>    <!-- torace -->
          <circle cx="17.2" cy="7" r="2.4"></circle>                <!-- testa -->
          <path class="strisce" d="M4.2 4.2 V9.8 M7.2 3.8 V10.2"></path>
          <rect class="carico" x="20.5" y="5" width="3.5" height="4" rx="0.6"></rect>  <!-- briciola, foglia, uovo o morta -->
          <g class="ali"><ellipse cx="9" cy="2.5" rx="6" ry="2.4"></ellipse><ellipse cx="9" cy="11.5" rx="6" ry="2.4"></ellipse></g>  <!-- solo le alate -->
        </svg>
      </div>

      <!-- Il ragno "modello": script.js lo copia quando arriva il pericolo -->
      <div class="creatura ragno" id="modello-ragno" hidden>
        <svg viewBox="-30 -20 60 64" aria-hidden="true">
          <path d="M-5 -2 Q-16 -14 -24 -6 M-5 2 Q-18 -2 -26 8 M-5 5 Q-16 12 -22 22 M-4 8 Q-10 20 -14 30 M5 -2 Q16 -14 24 -6 M5 2 Q18 -2 26 8 M5 5 Q16 12 22 22 M4 8 Q10 20 14 30"></path>
          <ellipse cx="0" cy="12" rx="8" ry="10"></ellipse>   <!-- corpo -->
          <circle cx="0" cy="-2" r="6"></circle>              <!-- testa -->
          <circle class="occhi" cx="-2.2" cy="-4" r="1.4"></circle>
          <circle class="occhi" cx="2.2" cy="-4" r="1.4"></circle>
        </svg>
      </div>

      <!-- LA PIOGGIA: gocce che cadono e acqua che entra nel tunnel principale -->
      <div class="pericolo" id="pioggia" hidden>
        <svg class="pioggia-disegno" viewBox="0 0 960 552" aria-hidden="true">
          <path class="goccia" style="animation-delay: 0s" d="M30 30 l-3 10"></path>
          <path class="goccia" style="animation-delay: -0.3s" d="M110 36 l-3 10"></path>
          <path class="goccia" style="animation-delay: -0.6s" d="M190 28 l-3 10"></path>
          <path class="goccia" style="animation-delay: -0.15s" d="M270 34 l-3 10"></path>
          <path class="goccia" style="animation-delay: -0.45s" d="M350 30 l-3 10"></path>
          <path class="goccia" style="animation-delay: -0.75s" d="M430 26 l-3 10"></path>
          <path class="goccia" style="animation-delay: -0.2s" d="M520 26 l-3 10"></path>
          <path class="goccia" style="animation-delay: -0.5s" d="M600 34 l-3 10"></path>
          <path class="goccia" style="animation-delay: -0.8s" d="M680 28 l-3 10"></path>
          <path class="goccia" style="animation-delay: -0.35s" d="M760 32 l-3 10"></path>
          <path class="goccia" style="animation-delay: -0.65s" d="M840 30 l-3 10"></path>
          <path class="goccia" style="animation-delay: -0.1s" d="M920 36 l-3 10"></path>
