<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>BrainOS triste</title>
  <style>
    /* la lacrima di codice che scende */
    .lacrima { animation: goccia 1.4s linear infinite; }
    @keyframes goccia {
      0%   { transform: translateY(-4px); opacity: 0; }
      30%  { opacity: 1; }
      100% { transform: translateY(8px); opacity: 0; }
    }
  </style>
  <g fill="none" stroke="#0a9a32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 24 L26 10 L18 7 M68 24 L74 10 L82 7"/>
    <path d="M26 24 L74 24 L80 34 L78 60 L50 94 L22 60 L20 34 Z"/>
    <path d="M50 24 V31 M26 40 H32 L35 43 M74 40 H68 L65 43 M50 94 V85" stroke-width="2"/>
    <path d="M41 75 L50 71 L59 75" stroke-width="2.6"/>
  </g>
  <g fill="#0a9a32">
    <circle cx="18" cy="7" r="3"/>
    <circle cx="82" cy="7" r="3"/>
    <circle cx="50" cy="33" r="2.2"/>
    <circle cx="36" cy="44" r="2"/>
    <circle cx="64" cy="44" r="2"/>
    <circle cx="50" cy="83" r="2.2"/>
    <path d="M29 52 L45 46 L44 50 L31 56 Z M71 52 L55 46 L56 50 L69 56 Z"/>
    <g class="lacrima">
      <rect x="33" y="60" width="2.4" height="4"/>
      <rect x="33" y="66" width="2.4" height="3" opacity="0.7"/>
      <rect x="33" y="71" width="2.4" height="2" opacity="0.45"/>
    </g>
  </g>
</svg>
